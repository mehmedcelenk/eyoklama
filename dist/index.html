<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./assets/manifest-Bm5U6o9k.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon-192-C9yt5Q7i.svg" />
  <link rel="apple-touch-icon" href="./assets/icon-192-C9yt5Q7i.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="eYoklama" />
  <title>eYoklama V3</title>

  <script type="module" crossorigin src="./app.js"></script>
  <link rel="stylesheet" crossorigin href="./style.css">
<link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>

<body>
<main class="app">
  <section id="loginView" class="login-view">
    <div class="login-head">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <div><h1>eYoklama</h1><p id="loginSubtitle" class="muted">Yoklama. Gerektiği kadar.</p></div>
    </div>
    <div class="login-panel stack">
      <div class="mode-toggle" style="margin-bottom:8px">
        <button id="teacherLoginTabBtn" class="active" type="button" data-action="switch-login-tab" data-tab="teacher">Hoca Girişi</button>
        <button id="parentQueryTabBtn" type="button" data-action="switch-login-tab" data-tab="parent">Veli Not Sorgu</button>
        <button id="adminLoginTabBtn" type="button" data-action="switch-login-tab" data-tab="admin">Kurum Girişi</button>
      </div>

      <!-- 1. HOCA GİRİŞİ SEKME -->
      <div id="teacherLoginSection" class="stack">
        <div id="teacherInputGroup" class="stack">
          <label>Kurum Kodu<input id="teacherInstCode" type="text" autocomplete="organization" maxlength="50" placeholder="Örn: default, bilfen, kabatas"></label>
          <label>Hoca Adı Soyadı<input id="teacherFullName" type="text" autocomplete="name" maxlength="80" placeholder="Adınız ve Soyadınız"></label>
          <label>T.C. Kimlik No
            <input id="teacherTc" type="text" inputmode="numeric" maxlength="11" placeholder="11 haneli T.C. No" style="letter-spacing:1px">
          </label>
          <button id="teacherSubmitBtn" type="button" class="btn" data-action="teacher-submit">Giriş Yap / Onaya Gönder</button>
        </div>

        <div id="teacherPendingCard" class="stack hidden" style="text-align:center;padding:16px 8px;border:1px dashed var(--line);border-radius:8px;background:var(--surface)">
          <div style="font-weight:700;font-size:1rem;color:var(--text)">⏳ Yöneticinizden Onay Bekleniyor…</div>
          <div class="muted tiny" style="margin-top:4px">Kayıt talebiniz iletildi. Okul yöneticiniz onay verdiği anda otomatik olarak içeri alınacaksınız.</div>
          <div style="margin-top:12px;display:flex;justify-content:center;gap:8px">
            <button id="teacherCancelPollBtn" type="button" class="btn secondary tiny" data-action="teacher-cancel-poll" style="max-width:140px">İptal Et</button>
          </div>
        </div>

        <div id="teacherLoginMsg" class="notice hidden"></div>
      </div>

      <!-- 2. VELİ NOT SORGU SEKME -->
      <div id="parentQuerySection" class="stack hidden">
        <label>Kurum Kodu<input id="parentInstCode" type="text" maxlength="50" placeholder="Örn: default, bilfen"></label>
        <label>Öğrencinin T.C. Kimlik Numarası
          <input id="parentTcInput" type="text" inputmode="numeric" maxlength="11" placeholder="11 haneli T.C. No" style="font-size:1.1rem;letter-spacing:1px" />
        </label>
        <button type="button" class="btn" data-action="query-parent-report">Sorgula</button>
        <div id="parentReportResult"></div>
      </div>

      <!-- 3. KURUM GİRİŞİ (YÖNETİCİ) SEKME -->
      <div id="adminLoginSection" class="stack hidden">
        <label>Kurum Kodu<input id="adminInstCode" type="text" autocomplete="organization" maxlength="50" placeholder="Örn: default, bilfen"></label>
        <label>Yönetici Şifresi
          <div class="password-wrap">
            <input id="adminPasswordInput" type="password" maxlength="64" autocomplete="current-password" placeholder="••••••••">
            <button type="button" id="adminPasswordEyeBtn" class="password-eye" aria-label="Parolayı göster" title="1 saniye göster">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </label>
        <button id="adminSubmitBtn" type="button" class="btn" data-action="admin-login">Yönetici Girişi Yap</button>
        <div id="adminLoginMsg" class="notice hidden"></div>
      </div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <header id="topNav" class="top-nav">
      <div id="topBrandBtn" class="top-nav-brand">
        <div id="topBrandLogo" class="login-mark small" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <button id="topBackBtn" type="button" class="icon-btn ghost hidden" aria-label="Geri" title="Geri">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="brand-title">eYoklama</span>
      </div>
      <div id="topNavActions" class="top-nav-actions">
        <button id="topPermBtn" type="button" class="top-icon-btn" title="Günün İzinlilerini Seç" aria-label="İzinli Ekle">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h8"/><path d="M12 14v4"/></svg>
          <span id="topPermBadge" class="badge-count hidden">0</span>
        </button>
        <button id="topGradesBtn" type="button" class="top-icon-btn" title="Not & Kanaat" aria-label="Not ve Kanaat">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button id="topAdminBtn" type="button" class="top-icon-btn" title="Ayarlar (Sınıflar & Kurum)" aria-label="Ayarlar">
          <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="topLogoutBtn" type="button" class="top-icon-btn danger" title="Çıkış Yap" aria-label="Çıkış">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <section id="listsPage" class="page"></section>
    <section id="newPage" class="page hidden"></section>
    <section id="historyPage" class="page hidden"></section>
    <section id="adminPage" class="page hidden"></section>
    <section id="gradesPage" class="page hidden"></section>
    <section id="attendancePage" class="hidden"></section>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
</body>
</html>
