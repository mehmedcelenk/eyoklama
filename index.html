<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
  <link rel="apple-touch-icon" href="./icon-192.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="eYoklama" />
  <title>eYoklama V3</title>

  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./src/app/bootstrap.ts"></script>
</head>

<body>
<main class="app">
  <section id="loginView" class="login-view">
    <div class="login-head">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <div><h1>eYoklama</h1><p class="muted">Yoklama. Gerektiği kadar.</p></div>
    </div>
    <div class="login-panel stack">
      <div id="continueLogin" class="continue-teacher hidden">
        <button id="continueTeacherBtn" class="btn">Hoca olarak devam et</button>
        <div class="login-divider">veya</div>
        <button id="differentTeacherBtn" class="btn secondary">Farklı hoca / üst yönetici</button>
      </div>

      <div id="credentialLogin" class="stack">
        <label>Hoca adı<input id="loginName" type="text" autocomplete="name" maxlength="80" placeholder="Ahmet Hoca"></label>
        <label>PIN / Parola
          <div class="password-wrap">
            <input id="loginPin" type="password" maxlength="64" autocomplete="current-password" placeholder="••••••">
            <button type="button" id="passwordEyeBtn" class="password-eye" aria-label="Parolayı göster" title="1 saniye göster">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </label>
        <button id="loginBtn" class="btn">Giriş yap</button>
      </div>

      <div id="loginMessage" class="notice hidden"></div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <header id="topNav" class="top-nav">
      <div id="topBrandBtn" class="top-nav-brand">
        <div class="login-mark small" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </div>
        <span class="brand-title">eYoklama</span>
      </div>
      <div class="top-nav-actions">
        <button id="topPermBtn" type="button" class="top-icon-btn" title="Günün İzinlilerini Seç" aria-label="İzinli Ekle">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h8"/><path d="M12 14v4"/></svg>
          <span id="topPermBadge" class="badge-count hidden">0</span>
        </button>
        <button id="topAddBtn" type="button" class="top-icon-btn" title="Yoklama Ekle" aria-label="Yoklama Ekle">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="topAdminBtn" type="button" class="top-icon-btn hidden" title="Yönetim & Ayarlar" aria-label="Yönetim">
          <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="topLogoutBtn" type="button" class="top-icon-btn danger" title="Çıkış Yap" aria-label="Çıkış">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <section id="listsPage" class="page"></section>
    <section id="newPage" class="page hidden"></section>
    <section id="historyPage" class="page hidden"></section>
    <section id="adminPage" class="page hidden"></section>
    <section id="attendancePage" class="hidden"></section>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
</body>
</html>
